/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; max-width: 1200px; width: 100%; margin-inline: auto; }
.brand h1 { margin: 0; font: 800 26px/1.1 var(--display); color: var(--ink); letter-spacing: -0.01em; }
.brand p { margin: 0; font: 800 32px/1.2 var(--display); color: #0e2f6b; }
.brand p b { font-family: var(--display); color: inherit; }
.stats { display: flex; gap: 10px; }
.stat { background: rgba(255,255,255,.88); border: 2px solid var(--ink); border-radius: 12px; padding: 6px 14px; display: flex; flex-direction: column; min-width: 96px; }
.stat .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); }
.stat .v { font: 800 20px/1.2 var(--display); font-variant-numeric: tabular-nums; }

/* stage */
.stage { position: relative; flex: 1; min-height: 420px; container-type: size; overflow: hidden; overflow: clip; margin-top: 6px; }
.peak { --pw: min(100cqw, 140cqh); position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: var(--pw); aspect-ratio: 1672 / 941; }
.mtn { display: block; width: 100%; height: 100%; user-select: none; pointer-events: none; filter: drop-shadow(0 10px 18px rgba(11,37,69,.28)); }
@media (max-width: 640px) {
  .peak { --pw: min(190cqw, 140cqh); left: calc(80cqw - 0.515 * var(--pw)); transform: none; }
  .brand p { font-size: 26px; }
}

/* checkpoints */
.pt { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); display: grid; place-items: center; font: 800 14px/1 var(--display); color: var(--ink); z-index: 1; transition: background .3s, color .3s; }
.pt.start { width: 22px; height: 22px; margin: -11px 0 0 -11px; background: var(--ice-pale); }
.pt.summit { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 18px; }
.pt.done { background: var(--lime); font-size: 0; }
.pt.done::after { content: ""; width: 11px; height: 6px; border: solid var(--ink); border-width: 0 0 3px 3px; transform: rotate(-45deg) translate(1px, -1px); }
.pt.cur { background: var(--jacket); color: #fff; animation: ring 1.6s infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(232,74,8,.6); } 100% { box-shadow: 0 0 0 16px rgba(232,74,8,0); } }

/* climber */
.climber { position: absolute; height: 15%; aspect-ratio: 1205 / 1305; transform: translate(-45%, calc(-100% - 6px)); z-index: 2; transition: left 1.5s cubic-bezier(.45,.05,.3,1), top 1.5s cubic-bezier(.45,.05,.3,1); pointer-events: none; }
.climber img { display: block; width: 100%; height: 100%; transform-origin: 50% 100%; filter: drop-shadow(0 4px 6px rgba(11,37,69,.3)); }
.climber.moving img { animation: sway .5s ease-in-out infinite; }
.climber.slip img { animation: slip .6s ease-in-out; }
@keyframes sway { 0%,100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-3%); } }
@keyframes slip { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 45% { transform: rotate(7deg); } 70% { transform: rotate(-4deg); } }

/* signboard */
.scrim { position: absolute; inset: 0; display: grid; place-items: center; padding: 14px; background: rgba(11,37,69,.4); overflow: auto; animation: fade .25s both; z-index: 5; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.card { width: min(460px, 100%); background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink); overflow: hidden; animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; transform-origin: 50% 90%; margin-block: auto; }
@keyframes pop { from { opacity: 0; transform: translateY(40px) scale(.6); } to { opacity: 1; transform: none; } }
.card.shake { animation: shake .4s; }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-9px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.sign { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--ink); color: #fff; padding: 10px 20px; font: 800 14px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.sign .alt { color: var(--ice); font-variant-numeric: tabular-nums; white-space: nowrap; }
.body { padding: 18px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.pic { width: 84px; height: 84px; border-radius: 50%; background: var(--ice-pale); border: 3px solid var(--ink); display: grid; place-items: center; font-size: 46px; line-height: 1; }
.prompt { margin: 4px 0 0; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 4px 12px; font: 800 40px/1.1 var(--display); }
.slot { display: inline-block; min-width: 4.4ch; text-align: center; color: var(--jacket); border-bottom: 4px dashed var(--jacket); padding-bottom: 2px; }
.slot.ok { border-bottom-style: solid; border-color: var(--lime); color: var(--ink); }
.ru { margin: 0; font-weight: 700; font-size: 18px; color: var(--ink-soft); }
.opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin-top: 8px; }
.opt { font: 800 24px/1 var(--display); padding: 16px 6px; border: 3px solid var(--ink); border-radius: 14px; background: var(--ice); color: var(--ink); cursor: pointer; box-shadow: 0 4px 0 var(--ink); transition: transform .08s, box-shadow .08s, background .15s; }
.opt:hover:not(:disabled) { background: #b9e0fb; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.opt:disabled { cursor: default; }
.opt.good { background: #bfe38a; }
.opt.bad { background: #ffd6cc; border-color: var(--bad); color: #8f1e0e; box-shadow: 0 4px 0 var(--bad); }
.opt.dim { opacity: .45; }
.fb { width: 100%; min-height: 76px; border-radius: 14px; padding: 12px 14px; background: #eef4fa; font-size: 15px; line-height: 1.45; font-weight: 700; color: var(--ink); text-align: left; }
.fb.good { background: #e4f4cc; }
.fb.bad { background: #ffe3dc; }
.fb b { font-family: var(--display); }
.go, .btn { font: 800 20px/1 var(--display); padding: 15px 22px; width: 100%; border: 3px solid var(--ink); border-radius: 14px; background: var(--jacket); color: #fff; cursor: pointer; box-shadow: 0 4px 0 var(--ink); }
.go:active, .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.go:hover, .btn:hover { background: #f05a1a; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

/* start / end cards */
.card h2 { margin: 0; font: 800 30px/1.1 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.lead { margin: 0; font-weight: 700; color: var(--ink-soft); line-height: 1.45; }
.rules { list-style: none; margin: 4px 0 6px; padding: 0; width: 100%; display: flex; flex-direction: column; gap: 8px; }
.rules li { display: flex; align-items: center; gap: 12px; text-align: left; background: #eef4fa; border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 15px; line-height: 1.35; }
.rules .tag { flex: none; min-width: 66px; text-align: center; font: 800 20px/1 var(--display); background: var(--ice); border: 3px solid var(--ink); border-radius: 10px; padding: 8px 6px; }
.stars { display: flex; gap: 6px; }
.stars svg { width: 46px; height: 46px; }
.review { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0; padding: 0; list-style: none; }
.review li { background: #ffe3dc; border-radius: 999px; padding: 4px 12px; font: 800 15px/1.3 var(--display); }
.summary { font: 800 20px/1.3 var(--display); }

/* victory */
.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 7; }
.scrim.win { background: radial-gradient(circle at 50% 50%, rgba(255,214,102,.55), rgba(11,37,69,.5) 70%); }
.scrim.win::before { content: ""; position: absolute; left: 50%; top: 50%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; background: repeating-conic-gradient(rgba(255,230,140,.38) 0 7deg, rgba(255,230,140,0) 7deg 18deg); animation: spin 28s linear infinite; pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.scrim.win .card { position: relative; }
.card.gold { border-color: var(--ink); box-shadow: 0 8px 0 var(--ink), 0 0 0 6px #ffb400, 0 0 50px 12px rgba(255,200,60,.75); }
.card.gold .sign { background: linear-gradient(90deg, #b87900, #ffb400 50%, #b87900); color: var(--ink); }
.card.gold .sign .alt { color: var(--ink); }
.card.gold h2 { color: var(--jacket); }
.card.gold .stars svg { animation: starpop .7s cubic-bezier(.2,1.6,.4,1) both; }
.card.gold .stars svg:nth-child(2) { animation-delay: .15s; }
.card.gold .stars svg:nth-child(3) { animation-delay: .3s; }
@keyframes starpop { from { transform: scale(0) rotate(-120deg); } to { transform: none; } }
.climber.flag { height: 28%; aspect-ratio: 473 / 1267; transform: translate(-50.8%, calc(-100% + 3px)); }
.climber.flag img { animation: plant .9s cubic-bezier(.2,1.5,.4,1) both, wave 2.8s ease-in-out .9s infinite; }
@keyframes plant { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wave { 0%,100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
.summit-banner { position: absolute; left: 4px; top: 8px; z-index: 4; display: flex; flex-direction: column; gap: 2px; padding: 10px 18px 12px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 5px 0 var(--ink); animation: pop .5s cubic-bezier(.2,1.4,.4,1) both; }
.summit-banner b { font: 800 40px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.summit-banner span { font: 800 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--jacket); }

/* confetti */
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }

  function show(html) {

  function hint(q, chose) {

  function showStart() {

  function answer(choice) {

    var btn = card.querySelector('.opt[data-o="' + choice + '"]');

    var missed = queue.filter(function (q) { return q.missed; });

    show('<div class="sign"><span id="ttl">' + 'Summit</span><span class="alt">' + alt(N) + '\u00a0m</span></div>' +
      '<div class="body"><h2>You are at the top!</h2><div class="stars">' + s + '</div>' +
      '<p class="summary">' + good + ' of ' + N + ' right the first time</p>' + rev +

  var fxRaf = 0;
